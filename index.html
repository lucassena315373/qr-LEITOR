*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:4px solid var(--navy);box-shadow:0 3px 12px #00000012}.brand{display:flex;align-items:center;gap:12px;padding:10px 16px}.brand img{width:54px;height:54px;object-fit:contain}.brand h1{font-size:19px;margin:0;color:var(--navy);font-style:italic}.brand p{margin:2px 0 0;color:var(--red);font-weight:700;font-size:12px}.stripe{height:7px;background:linear-gradient(#d40000 0 45%,#fff 45% 55%,#06356d 55%)}nav{display:flex;gap:6px;padding:8px 12px;overflow:auto;background:#fff}nav button{border:0;background:#eef3f9;color:var(--navy);padding:9px 12px;border-radius:10px;font-weight:700;white-space:nowrap}nav button.active{background:var(--navy);color:#fff}.main{max-width:1250px;margin:auto;padding:18px}.view{display:none}.view.active{display:block}.grid{display:grid;gap:14px}.grid-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.grid-3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}.hero{background:linear-gradient(135deg,#fff,#eef4fb);border-left:6px solid var(--red)}.hero h2{margin:0 0 5px;color:var(--navy)}.muted{color:var(--muted)}.kpi{font-size:30px;font-weight:800;color:var(--navy)}.small{font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:750}.btn.primary{background:var(--navy);color:#fff}.btn.red{background:var(--red);color:#fff}.btn.light{background:#edf2f8;color:var(--navy)}.btn.ok{background:#e4f7ee;color:var(--ok)}.btn.warn{background:#fff3dc;color:var(--warn)}.btn.danger{background:#fde9e7;color:var(--bad)}.btn:disabled{opacity:.45;cursor:not-allowed}.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}.field label{font-weight:700;font-size:13px}.field input,.field select,.field textarea{width:100%;border:1px solid #cdd7e5;border-radius:9px;padding:9px;background:#fff}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid var(--line);padding:9px;text-align:left;white-space:nowrap}.table th{background:#f0f4f9;color:var(--navy)}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.pill.ok{background:#e3f7ec;color:var(--ok)}.pill.warn{background:#fff1d8;color:var(--warn)}.pill.bad{background:#fde6e3;color:var(--bad)}.answer-grid{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:10px}.answer-col{border:1px solid var(--line);border-radius:12px;padding:9px}.answer-row{display:grid;grid-template-columns:35px repeat(4,1fr);gap:5px;align-items:center;margin:4px 0}.answer-row .q{font-weight:800}.bubble-btn{border:1px solid #c5cedb;background:#fff;border-radius:50%;width:30px;height:30px;padding:0;font-weight:800}.bubble-btn.selected{background:var(--navy);color:#fff;border-color:var(--navy)}.bubble-btn.correct{outline:3px solid #66c995}.bubble-btn.wrong{outline:3px solid #e46d63}.bubble-btn.blank{background:#f4f6f8}.scanner{display:grid;grid-template-columns:minmax(280px,1.3fr) minmax(280px,.7fr);gap:16px}.camera-box{position:relative;background:#111;border-radius:18px;overflow:hidden;min-height:360px;display:flex;align-items:center;justify-content:center}.camera-box video,.camera-box canvas{width:100%;height:auto;display:block}.camera-box canvas{position:absolute;inset:0}.guide{position:absolute;inset:8% 6%;border:2px dashed #fff;border-radius:16px;box-shadow:0 0 0 9999px #00000030;pointer-events:none}.guide .guide-label{position:absolute;top:-34px;left:0;background:#000b;color:#fff;border-radius:8px;padding:6px 9px;font-size:12px}.status{padding:10px;border-radius:10px;background:#eef4fb;color:var(--navy);font-size:13px}.status.good{background:#e7f8ef;color:var(--ok)}.status.bad{background:#fdeae8;color:var(--bad)}.status.warn{background:#fff4dd;color:var(--warn)}.result-box{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.result-kpi{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.result-kpi strong{display:block;font-size:25px;color:var(--navy)}.check-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}.check{padding:7px;border-radius:8px;font-size:12px}.check.correct{background:#e6f7ee}.check.wrong{background:#fde9e7}.check.blank{background:#f1f3f5}.check.amb{background:#fff2d9}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:50;padding:15px}.modal.show{display:flex}.modal-card{background:#fff;border-radius:18px;max-width:850px;width:100%;max-height:90vh;overflow:auto;padding:18px}.close{float:right;border:0;background:#eef2f7;border-radius:50%;width:34px;height:34px}.drop{border:2px dashed #b9c6d8;border-radius:14px;padding:20px;text-align:center;background:#f8fafc}.progress{height:8px;background:#e7edf4;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:var(--red);width:0}.empty{text-align:center;padding:35px;color:var(--muted)}.print-only{display:none}.notice{font-size:12px;background:#fff9e8;border-left:4px solid #e2a600;padding:9px;border-radius:8px}.logo-preview{width:90px;height:90px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#fff}.qrbox{background:#fff;padding:10px;border:1px solid var(--line);border-radius:10px;display:inline-block}.footer{margin-top:30px;color:var(--muted);font-size:11px;text-align:center}.responsive-hide{display:block}.batch-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#eef4fb;border:1px solid #cbd9ea;padding:10px;border-radius:12px;margin:10px 0}.scan-preview{max-width:100%;border:1px solid var(--line);border-radius:12px;background:#fff}.progress-text{font-size:12px;color:var(--muted)}.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.metric{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.metric strong{display:block;font-size:24px;color:var(--navy)}.sync-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#d99a00;margin-right:5px}.sync-dot.on{background:#14804a}
@media(max-width:850px){.scanner{grid-template-columns:1fr}.answer-grid{grid-template-columns:1fr 1fr}.result-box{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.main{padding:10px}.brand h1{font-size:16px}.brand img{width:44px;height:44px}.answer-grid{grid-template-columns:1fr}.camera-box{min-height:300px}.responsive-hide{display:none}}
@media print{body{background:#fff}.topbar,nav,.toolbar,.no-print{display:none!important}.main{max-width:none;padding:0}.view{display:none!important}.view.printing{display:block!important}.print-only{display:block}.card{box-shadow:none;border:0}.stripe{print-color-adjust:exact;-webkit-print-color-adjust:exact}}

<body>
<div class="app">
<header class="topbar">
  <div class="brand"><img src="assets/logo-escola.png" alt="Escola Estadual João Paulo II"><div><h1>ESCOLA ESTADUAL JOÃO PAULO II</h1><p>CORRETOR DE SIMULADOS • DRE MARACANÃ</p></div></div>
  <div class="stripe"></div>
  <nav id="nav"></nav>
</header>
<main class="main">
<section id="dashboard" class="view active"></section>
<section id="correcao" class="view"></section>
<section id="alunos" class="view"></section>
<section id="simulados" class="view"></section>
<section id="resultados" class="view"></section>
<section id="relatorios" class="view"></section>
<section id="config" class="view"></section>
<section id="cartaoPrint" class="view"></section>
</main>
<div id="modal" class="modal"><div class="modal-card"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
'use strict';
const APP='jpii-corretor-v4';
const SYNC_KEY='jpii-corretor-sync-v1';
let supa=null, syncTimer=null, syncChannel=null, syncBusy=false, syncUser=null, syncReady=false;
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=(p='id')=>p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
const defaultSimulados=[
 {id:'S1',nome:'Simulado 1 — Linguagens e Projeto de Vida',cartao:30,disciplinas:[['Língua Portuguesa',1,10],['Est. Orient. Língua Portuguesa',11,20],['Projeto de Vida',21,30]]},
 {id:'S2',nome:'Simulado 2 — Humanas',cartao:35,disciplinas:[['Ensino Religioso',1,5],['Geografia',6,15],['Estudos Amazônicos',16,25],['História',26,35]]},
 {id:'S3',nome:'Simulado 3 — Ciências',cartao:30,disciplinas:[['Ciências da Natureza',1,15],['Educação Ambiental',16,30]]},
 {id:'S4',nome:'Simulado 4 — Matemática',cartao:30,disciplinas:[['Matemática',1,10],['Est. Orient. de Matemática',11,20],['Educação Financeira',21,30]]},
 {id:'S5',nome:'Simulado 5 — Arte, Inglês e Educação Física',cartao:30,disciplinas:[['Educação Física',1,10],['Arte',11,20],['Inglês',21,30]]}
];
const makeClassKeys=(n,classes=['6º','7º','8º','9º'])=>Object.fromEntries(classes.map(c=>[c,Array(n).fill('')]));
const defaultState={version:4,school:'ESCOLA ESTADUAL JOÃO PAULO II',dre:'DRE MARACANÃ',classes:['6º','7º','8º','9º'],students:[],simulados:defaultSimulados,keys:{S1:makeClassKeys(30),S2:makeClassKeys(35),S3:makeClassKeys(30),S4:makeClassKeys(30),S5:makeClassKeys(30)},results:[],settings:{gradeMax:10,markThreshold:.13,ambiguityRatio:1.22},sync:{enabled:false,url:'',anonKey:'',email:'',lastSync:null}};
function normalizeKeys(raw){const out={};for(const sim of defaultState.simulados){const n=sim.cartao;const old=raw?.[sim.id];if(old && !Array.isArray(old) && typeof old==='object'){out[sim.id]={};for(const c of stateClassesFallback())out[sim.id][c]=Array.isArray(old[c])?old[c].slice(0,n).concat(Array(Math.max(0,n-(old[c]?.length||0))).fill('')).slice(0,n):Array(n).fill('')}else{out[sim.id]={};for(const c of stateClassesFallback())out[sim.id][c]=Array.isArray(old)?old.slice(0,n).concat(Array(Math.max(0,n-old.length)).fill('')).slice(0,n):Array(n).fill('')}}return out}
function stateClassesFallback(){return ['6º','7º','8º','9º']}
let state=loadState(); let current='dashboard'; let stream=null; let lastFrame=null; let scanAnswers=[]; let scanConfidence=[]; let scanAmb=[]; let pendingResult=null;
function loadState(){try{const s=JSON.parse(localStorage.getItem(APP)); if(s){const merged={...clone(defaultState),...s,settings:{...defaultState.settings,...(s.settings||{})},sync:{...defaultState.sync,...(s.sync||{})}};merged.classes=Array.isArray(s.classes)&&s.classes.length?s.classes:clone(defaultState.classes);const raw=s.keys||{};merged.keys={};for(const sim of merged.simulados){const n=sim.cartao,old=raw[sim.id];merged.keys[sim.id]={};for(const c of merged.classes){if(old && !Array.isArray(old) && Array.isArray(old[c])) merged.keys[sim.id][c]=old[c].slice(0,n).concat(Array(Math.max(0,n-old[c].length)).fill('')).slice(0,n);else if(Array.isArray(old)) merged.keys[sim.id][c]=old.slice(0,n).concat(Array(Math.max(0,n-old.length)).fill('')).slice(0,n);else merged.keys[sim.id][c]=Array(n).fill('')}}return merged}}catch(e){} return clone(defaultState)}
function saveLocal(){localStorage.setItem(APP,JSON.stringify(state)); renderDashboardMini()}
function mergeState(base,remote){
  const m=clone(base); if(!remote)return m;
  m.classes=Array.from(new Set([...(m.classes||[]),...(remote.classes||[])]));
  const byId=new Map((m.students||[]).map(x=>[x.id,x])); for(const x of remote.students||[])byId.set(x.id,x); m.students=[...byId.values()];
  const sims=new Map((m.simulados||[]).map(x=>[x.id,x])); for(const x of remote.simulados||[])sims.set(x.id,x); m.simulados=[...sims.values()];
  m.keys=m.keys||{}; for(const sim of m.simulados){m.keys[sim.id]=m.keys[sim.id]||{};const rk=remote.keys?.[sim.id]||{};for(const c of m.classes){const a=m.keys[sim.id][c],b=rk[c];if(!Array.isArray(a)&&Array.isArray(b))m.keys[sim.id][c]=clone(b);else if(Array.isArray(a)&&Array.isArray(b)){const n=sim.cartao;const out=a.slice(0,n);for(let i=0;i<n;i++)if(!out[i]&&b[i])out[i]=b[i];m.keys[sim.id][c]=out}}}
  const rs=new Map((m.results||[]).map(x=>[x.id,x])); for(const x of remote.results||[])rs.set(x.id,x); m.results=[...rs.values()];
  m.settings={...m.settings,...(remote.settings||{})}; m.school=remote.school||m.school; m.dre=remote.dre||m.dre; return m;
}
function getSyncConfig(){try{return JSON.parse(localStorage.getItem(SYNC_KEY)||'{}')}catch(e){return {}}}
function saveSyncConfig(c){localStorage.setItem(SYNC_KEY,JSON.stringify(c||{}))}
async function initSupabase(){
  const c={...(state.sync||{}),...getSyncConfig()}; if(!c.url||!c.anonKey||!window.supabase){syncReady=false;return false}
  try{if(!supa||supa._url!==c.url){supa=window.supabase.createClient(c.url,c.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});supa._url=c.url}
    const {data}=await supa.auth.getSession(); syncUser=data?.session?.user||null; syncReady=!!syncUser; if(syncReady) await pullRemote(true); return true;
  }catch(e){syncReady=false;return false}
}
async function signInSync(email,password){if(!window.supabase)return alert('Biblioteca de sincronização não carregada. Abra com internet.');const c=getSyncConfig();if(!c.url||!c.anonKey)return alert('Primeiro informe a URL e a chave pública do Supabase em Configurações → Sincronização.');try{if(!supa||supa._url!==c.url){supa=window.supabase.createClient(c.url,c.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});supa._url=c.url}let r=await supa.auth.signInWithPassword({email,password});if(r.error)throw r.error;syncUser=r.data.user;syncReady=true;state.sync={...state.sync,enabled:true,url:c.url,anonKey:c.anonKey,email:syncUser.email};saveSyncConfig(state.sync);saveLocal();await pullRemote(true);subscribeRealtime();renderConfig();alert('Conectado. Este aparelho agora usa a mesma base dos outros aparelhos com esta conta.')}catch(e){alert('Não foi possível entrar: '+e.message)}}
async function signUpSync(email,password){if(!supa){const c=getSyncConfig();if(!c.url||!c.anonKey)return alert('Informe URL e chave do Supabase primeiro.');supa=window.supabase.createClient(c.url,c.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});supa._url=c.url}try{const r=await supa.auth.signUp({email,password});if(r.error)throw r.error;alert(r.data.session?'Conta criada e conectada.':'Conta criada. Confirme o e-mail se o projeto exigir confirmação.')}catch(e){alert('Erro ao criar conta: '+e.message)}}
async function signOutSync(){try{if(supa)await supa.auth.signOut()}catch(e){}syncUser=null;syncReady=false;if(syncChannel){supa.removeChannel(syncChannel);syncChannel=null}state.sync.enabled=false;saveLocal();renderConfig()}
async function pullRemote(initial=false){if(!supa||!syncUser)return;try{const r=await supa.from('app_states').select('data,updated_at').eq('user_id',syncUser.id).maybeSingle();if(r.error)throw r.error;if(r.data?.data){state=mergeState(state,r.data.data);state.sync={...state.sync,enabled:true,lastSync:r.data.updated_at||new Date().toISOString(),email:syncUser.email};saveLocal()}else{await pushRemote(true)}if(initial)subscribeRealtime()}catch(e){console.warn('sync pull',e)}}
async function pushRemote(force=false){if(!supa||!syncUser||syncBusy)return;syncBusy=true;try{const remote=await supa.from('app_states').select('data').eq('user_id',syncUser.id).maybeSingle();if(remote.data?.data)state=mergeState(state,remote.data.data);const payload={user_id:syncUser.id,data:{...state,sync:{...state.sync,lastSync:new Date().toISOString()}}};const r=await supa.from('app_states').upsert(payload,{onConflict:'user_id'});if(r.error)throw r.error;state.sync.lastSync=new Date().toISOString();saveLocal()}catch(e){console.warn('sync push',e)}finally{syncBusy=false}}
function scheduleSync(){if(!syncReady)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>pushRemote(),350)}
function subscribeRealtime(){if(!supa||!syncUser)return;if(syncChannel)supa.removeChannel(syncChannel);syncChannel=supa.channel('jpii-state-'+syncUser.id).on('postgres_changes',{event:'*',schema:'public',table:'app_states',filter:'user_id=eq.'+syncUser.id},payload=>{if(payload.new?.data){state=mergeState(state,payload.new.data);saveLocal();if(current)go(current)}}).subscribe()}
function save(){saveLocal();scheduleSync()}
function getKey(simId,turma){const sim=state.simulados.find(s=>s.id===simId);if(!sim)return [];state.keys[simId]=state.keys[simId]||{};state.keys[simId][turma]=state.keys[simId][turma]||Array(sim.cartao).fill('');return state.keys[simId][turma]}
function setKeyForClasses(simId,classes,answers){for(const c of classes){state.keys[simId]=state.keys[simId]||{};state.keys[simId][c]=clone(answers)}}
function save(){localStorage.setItem(APP,JSON.stringify(state)); renderDashboardMini()}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function nav(){const items=[['dashboard','Início'],['correcao','Corrigir cartão'],['alunos','Alunos'],['simulados','Simulados / Gabaritos'],['resultados','Resultados'],['relatorios','Relatórios'],['config','Configurações']];document.getElementById('nav').innerHTML=items.map(([id,n])=>`<button class="${current===id?'active':''}" onclick="go('${id}')">${n}</button>`).join('')}
function go(id){stopCamera(); current=id; document.querySelectorAll('.view').forEach(x=>x.classList.remove('active')); document.getElementById(id).classList.add('active'); nav(); ({dashboard:renderDashboard,correcao:renderCorrecao,alunos:renderAlunos,simulados:renderSimulados,resultados:renderResultados,relatorios:renderRelatorios,config:renderConfig}[id]||renderDashboard)()}
function renderDashboardMini(){if(current==='dashboard')renderDashboard()}
function renderDashboard(){const total=state.students.length, res=state.results.length, avg=res?state.results.reduce((a,r)=>a+r.pct,0)/res:0; document.getElementById('dashboard').innerHTML=`
<div class="card hero"><h2>Corretor de Simulados</h2><p>Leitura por câmera das marcações A, B, C e D dos cartões da escola. O sistema trabalha com os modelos de 30 e 35 questões já usados e permite criar outros modelos.</p><div class="toolbar"><button class="btn red" onclick="go('correcao')">📷 Corrigir cartão</button><button class="btn primary" onclick="go('alunos')">👥 Cadastrar alunos</button><button class="btn light" onclick="go('simulados')">📝 Gabaritos</button></div></div>
<div class="grid grid-3" style="margin-top:14px"><div class="card"><div class="muted">Alunos cadastrados</div><div class="kpi">${total}</div></div><div class="card"><div class="muted">Correções salvas</div><div class="kpi">${res}</div></div><div class="card"><div class="muted">Média das correções</div><div class="kpi">${avg.toFixed(1)}%</div></div></div>
<div class="grid grid-2" style="margin-top:14px"><div class="card"><h3>Fluxo recomendado</h3><ol><li>Cadastre/importе os alunos.</li><li>Cadastre os gabaritos dos 5 simulados.</li><li>Escolha o simulado e a turma.</li><li>Aponte a câmera para um cartão por vez.</li><li>Confira as marcações ambíguas antes de salvar.</li><li>Veja o resultado individual e da turma.</li></ol></div><div class="card"><h3>Segurança da correção</h3><p>O reconhecimento não “chuta” respostas duvidosas. Questões sem marcação, com duas marcações ou com baixa confiança ficam destacadas para conferência manual.</p><div class="notice">Para os cartões atuais, o aluno é selecionado no aplicativo, porque o nome escrito à mão não é usado como identificação automática. Em novos cartões, você pode usar QR de contexto.</div></div></div>`}
function renderAlunos(){document.getElementById('alunos').innerHTML=`<div class="card"><h2>Alunos</h2><p class="muted">Cadastre individualmente ou importe uma lista. CSV e XLSX são aceitos.</p><div class="toolbar"><button class="btn primary" onclick="openStudentModal()">+ Novo aluno</button><label class="btn light">Importar CSV/XLSX <input id="importStudents" type="file" accept=".csv,.txt,.xlsx" hidden onchange="importStudents(this.files[0])"></label><button class="btn light" onclick="exportStudentsCSV()">Exportar CSV</button></div><div class="grid grid-3"><div class="field"><label>Filtrar turma</label><select id="studentClassFilter" onchange="drawStudentTable()"><option value="">Todas</option>${state.classes.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Pesquisar</label><input id="studentSearch" oninput="drawStudentTable()" placeholder="Nome ou matrícula"></div></div><div id="studentTable"></div></div>`; drawStudentTable()}
function drawStudentTable(){const box=document.getElementById('studentTable');if(!box)return; const cls=document.getElementById('studentClassFilter')?.value||'', q=(document.getElementById('studentSearch')?.value||'').toLowerCase(); const arr=state.students.filter(s=>(!cls||s.turma===cls)&&(!q||(`${s.nome} ${s.id}`).toLowerCase().includes(q))); box.innerHTML=arr.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Nome</th><th>Matrícula/ID</th><th>Turma</th><th>Ações</th></tr></thead><tbody>${arr.map(s=>`<tr><td>${esc(s.nome)}</td><td>${esc(s.id)}</td><td>${esc(s.turma)}</td><td><button class="btn light" onclick="editStudent('${s.id}')">Editar</button> <button class="btn danger" onclick="deleteStudent('${s.id}')">Excluir</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum aluno encontrado.</div>'}
function openStudentModal(id){const s=id?state.students.find(x=>x.id===id):{id:'',nome:'',turma:state.classes[0]}; openModal(`<h2>${id?'Editar':'Novo'} aluno</h2><div class="grid grid-2"><div class="field"><label>Nome completo</label><input id="mName" value="${esc(s.nome)}"></div><div class="field"><label>Matrícula/ID (opcional)</label><input id="mId" value="${esc(s.id)}"></div><div class="field"><label>Turma</label><select id="mClass">${state.classes.map(c=>`<option ${c===s.turma?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div><div class="toolbar"><button class="btn primary" onclick="saveStudent('${id||''}')">Salvar</button><button class="btn light" onclick="closeModal()">Cancelar</button></div>`)}
function saveStudent(id){const nome=document.getElementById('mName').value.trim();const turma=document.getElementById('mClass').value;let sid=document.getElementById('mId').value.trim();if(!nome)return alert('Informe o nome.');if(!sid)sid=uid('ALU');if(id){const s=state.students.find(x=>x.id===id);if(s){s.nome=nome;s.turma=turma;if(sid!==id)s.id=sid}}else{if(state.students.some(s=>s.id===sid))return alert('Já existe um aluno com esse ID.');state.students.push({id:sid,nome,turma})}save();closeModal();renderAlunos()}
function editStudent(id){openStudentModal(id)}
function deleteStudent(id){if(!confirm('Excluir este aluno? Os resultados já salvos serão mantidos.'))return;state.students=state.students.filter(s=>s.id!==id);save();renderAlunos()}
function parseCSV(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];const sep=lines[0].includes(';')?';':',';const parse=line=>{let a=[],cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===sep&&!q){a.push(cur.trim());cur=''}else cur+=ch}a.push(cur.trim());return a};const h=parse(lines[0]).map(x=>x.toLowerCase());return lines.slice(1).map(line=>{const v=parse(line),o={};h.forEach((k,i)=>o[k]=v[i]||'');return o}).filter(o=>Object.values(o).some(Boolean))}
async function importStudents(file){if(!file)return;try{let rows=[];if(file.name.toLowerCase().endsWith('.xlsx'))rows=await parseXLSX(file);else rows=parseCSV(await file.text());let n=0;for(const r of rows){const name=r.nome||r['nome completo']||r.aluno||r.name||Object.values(r)[0];const turma=r.turma||r.classe||r.serie||r['turma/ano']||state.classes[0];const id=r.id||r.matricula||r['matrícula']||r.codigo||uid('ALU');if(name){const old=state.students.find(s=>s.id===id);if(old){old.nome=name;old.turma=turma}else{state.students.push({id,nome:name,turma});n++}}}save();renderAlunos();alert(`${n} aluno(s) novo(s) importado(s).`)}catch(e){console.error(e);alert('Não foi possível ler o arquivo. Para maior compatibilidade, use CSV UTF-8 com as colunas Nome, Turma e Matrícula/ID.')}}
async function zipEntries(buf){const b=new Uint8Array(buf),dv=new DataView(buf);let pos=-1;for(let i=b.length-22;i>=Math.max(0,b.length-66000);i--){if(dv.getUint32(i,true)===0x06054b50){pos=i;break}}if(pos<0)throw Error('ZIP inválido');const cdSize=dv.getUint32(pos+12,true),cdOff=dv.getUint32(pos+16,true);let p=cdOff,end=cdOff+cdSize;const entries={};while(p<end){if(dv.getUint32(p,true)!==0x02014b50)break;const method=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),us=dv.getUint32(p+24,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);const name=new TextDecoder().decode(b.slice(p+46,p+46+nl));const lp=lo,ln=dv.getUint16(lp+26,true),le=dv.getUint16(lp+28,true),start=lp+30+ln+le;entries[name]={method,cs,us,start};p+=46+nl+el+cl}return {b,entries}}
async function zipRead(z,name){const e=z.entries[name];if(!e)throw Error('Entrada ausente: '+name);const data=z.b.slice(e.start,e.start+e.cs);if(e.method===0)return data;if(e.method===8){const ds=new DecompressionStream('deflate-raw');const out=await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer();return new Uint8Array(out)}throw Error('Compressão XLSX não suportada')}
async function parseXLSX(file){const z=await zipEntries(await file.arrayBuffer());const names=Object.keys(z.entries);const ssName=names.find(n=>n==='xl/sharedStrings.xml');let strings=[];if(ssName){const xml=new TextDecoder().decode(await zipRead(z,ssName));const d=new DOMParser().parseFromString(xml,'application/xml');strings=[...d.getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join(''))}const sheet=names.filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];if(!sheet)throw Error('Planilha não encontrada');const xml=new TextDecoder().decode(await zipRead(z,sheet));const d=new DOMParser().parseFromString(xml,'application/xml');const rows=[...d.getElementsByTagName('row')];const arr=[];for(const row of rows){const cells=[...row.getElementsByTagName('c')];const out=[];for(const c of cells){const ref=c.getAttribute('r')||'';const col=(ref.match(/[A-Z]+/)||['A'])[0];let idx=0;for(const ch of col)idx=idx*26+(ch.charCodeAt(0)-64);idx--;const t=c.getAttribute('t'),v=c.getElementsByTagName('v')[0]?.textContent||'';let val=v;if(t==='s')val=strings[Number(v)]||'';if(t==='inlineStr')val=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');out[idx]=val}arr.push(out)}const h=(arr.shift()||[]).map(x=>String(x||'').trim().toLowerCase());return arr.map(a=>{const o={};h.forEach((k,i)=>o[k]=a[i]||'');return o})}
function renderSimulados(){const cards=state.simulados.map(s=>{const classCounts=state.classes.map(c=>{const k=getKey(s.id,c);return `${esc(c)}: ${k.filter(Boolean).length}/${s.cartao}`}).join(' • ');return `<div class="card"><h3>${esc(s.nome)}</h3><p>${s.cartao} questões • ${s.disciplinas.length} disciplina(s)</p><div>${s.disciplinas.map(d=>`<span class="pill">${esc(d[0])}: ${d[1]}–${d[2]}</span>`).join(' ')}</div><p class="small muted"><b>Gabaritos por turma:</b> ${classCounts}</p><div class="toolbar"><button class="btn primary" onclick="editKey('${s.id}')">Gabaritos por turma</button><button class="btn light" onclick="openSimuladoModal('${s.id}')">Editar</button><button class="btn primary" onclick="openCardSeries('${s.id}')">🎓 Cartões por série</button><button class="btn light" onclick="showQrOnly('${s.id}')">🔲 Gerar QR</button></div></div>`}).join('');document.getElementById('simulados').innerHTML=`<div class="card"><h2>Simulados e gabaritos</h2><p class="muted">Cada turma possui seu próprio gabarito. Ao cadastrar ou alterar um gabarito, selecione obrigatoriamente a(s) turma(s) às quais ele pertence.</p><div class="toolbar"><button class="btn primary" onclick="openSimuladoModal()">+ Novo simulado</button><button class="btn light" onclick="backupData()">Backup completo</button><label class="btn light">Restaurar backup <input type="file" accept="application/json" hidden onchange="restoreData(this.files[0])"></label></div></div><div class="grid grid-2" style="margin-top:14px">${cards}</div>`}
function openSimuladoModal(id){const s=id?state.simulados.find(x=>x.id===id):{id:'',nome:'Novo simulado',cartao:30,disciplinas:[['Disciplina',1,30]]};openModal(`<h2>${id?'Editar':'Novo'} simulado</h2><div class="grid grid-2"><div class="field"><label>Nome</label><input id="sNome" value="${esc(s.nome)}"></div><div class="field"><label>Quantidade de questões</label><input id="sN" type="number" min="1" max="200" value="${s.cartao}" onchange="drawDiscInputs(${s.disciplinas.length})"></div></div><h3>Disciplinas e intervalos</h3><div id="discInputs"></div><div class="toolbar"><button class="btn light" onclick="addDiscInput()">+ Disciplina</button><button class="btn primary" onclick="saveSimulado('${id||''}')">Salvar</button></div>`);window.editingDisc=clone(s.disciplinas);drawDiscInputs()}
function drawDiscInputs(){const box=document.getElementById('discInputs');if(!box)return;const n=Number(document.getElementById('sN')?.value)||30;window.editingDisc=window.editingDisc||[['Disciplina',1,n]];box.innerHTML=window.editingDisc.map((d,i)=>`<div class="grid grid-3" style="align-items:end"><div class="field"><label>Disciplina</label><input data-di="${i}" data-k="0" value="${esc(d[0])}"></div><div class="field"><label>Questão inicial</label><input data-di="${i}" data-k="1" type="number" value="${d[1]}"></div><div class="field"><label>Questão final</label><input data-di="${i}" data-k="2" type="number" value="${d[2]}"></div></div>`).join('')}
function addDiscInput(){window.editingDisc.push(['Nova disciplina',1,Number(document.getElementById('sN').value)||30]);drawDiscInputs()}
function saveSimulado(id){const nome=document.getElementById('sNome').value.trim();const n=Math.max(1,Math.min(200,Number(document.getElementById('sN').value)||30));if(!nome)return alert('Informe o nome.');const ds=[];document.querySelectorAll('#discInputs [data-di]').forEach(el=>{const i=+el.dataset.di,k=+el.dataset.k;ds[i]=ds[i]||['',1,n];ds[i][k]=k===0?el.value.trim():Number(el.value)||0});const cleanDs=ds.filter(Boolean);if(!cleanDs.length)return alert('Informe pelo menos uma disciplina.');const sid=id||uid('S');if(id){const s=state.simulados.find(x=>x.id===id);Object.assign(s,{nome,cartao:n,disciplinas:cleanDs});state.keys[id]=state.keys[id]||{};for(const c of state.classes){const old=state.keys[id][c]||[];state.keys[id][c]=old.slice(0,n).concat(Array(Math.max(0,n-old.length)).fill('')).slice(0,n)}}else{state.simulados.push({id:sid,nome,cartao:n,disciplinas:cleanDs});state.keys[sid]=makeClassKeys(n,state.classes)}save();closeModal();renderSimulados()}
function editKey(id,initialClass=''){
 const s=state.simulados.find(x=>x.id===id); const selected=initialClass?[initialClass]:state.classes.filter(c=>getKey(id,c).some(Boolean)); const classes=selected.length?selected:[state.classes[0]]; const keys=getKey(id,classes[0]); let html='<h2>Gabarito — '+esc(s.nome)+'</h2><p class="muted">Cada turma pode ter um gabarito diferente. Selecione uma ou mais turmas para receber exatamente o gabarito que você está preenchendo.</p><div class="card" style="background:#f7faff"><b>Turmas deste gabarito:</b><div class="toolbar" style="margin:8px 0">'+state.classes.map(c=>`<label style="display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #ccd7e5;padding:7px 10px;border-radius:9px"><input type="checkbox" class="keyClass" value="${esc(c)}" ${classes.includes(c)?'checked':''}> ${esc(c)}</label>`).join('')+'<button class="btn light" onclick="document.querySelectorAll(\'.keyClass\').forEach(x=>x.checked=true)">Todas</button><button class="btn light" onclick="document.querySelectorAll(\'.keyClass\').forEach(x=>x.checked=false)">Limpar</button></div><div class="small muted">Ao salvar, o gabarito será copiado somente para as turmas selecionadas.</div></div><div class="answer-grid">';
 const per=Math.ceil(s.cartao/5); for(let start=1;start<=s.cartao;start+=per){const end=Math.min(s.cartao,start+per-1);html+='<div class="answer-col">';for(let q=start;q<=end;q++){html+='<div class="answer-row"><span class="q">'+String(q).padStart(2,'0')+'</span>';for(const o of ['A','B','C','D']){html+='<button class="bubble-btn '+(keys[q-1]===o?'selected':'')+'" data-key-q="'+q+'" data-key-o="'+o+'" onclick="setKey(this,\''+id+'\','+q+',\''+o+'\')">'+o+'</button>'}html+='</div>'}html+='</div>'}
 html+='</div><div class="toolbar"><button class="btn primary" onclick="saveKeyByClasses(\''+id+'\')">Salvar gabarito para turma(s)</button><button class="btn light" onclick="importKeyCSV(\''+id+'\')">Importar gabarito CSV</button></div><div class="notice">Formato CSV simples aceito: questão;resposta — por exemplo: 1;A. O arquivo importado também será aplicado somente às turmas selecionadas.</div>';
 openModal(html)
}
function selectedKeyClasses(){return [...document.querySelectorAll('.keyClass:checked')].map(x=>x.value)}
function setKey(btn,id,q,o){const classes=selectedKeyClasses();if(!classes.length){alert('Selecione pelo menos uma turma antes de preencher o gabarito.');return}const base=getKey(id,classes[0]);base[q-1]=base[q-1]===o?'':o;for(const c of classes)state.keys[id][c]=clone(base);document.querySelectorAll(`[data-key-q="${q}"]`).forEach(b=>b.classList.toggle('selected',b.dataset.keyO===base[q-1]));}
function saveKeyByClasses(id){const classes=selectedKeyClasses();if(!classes.length)return alert('Selecione pelo menos uma turma.');const s=state.simulados.find(x=>x.id===id);const first=getKey(id,classes[0]);setKeyForClasses(id,classes,first);save();closeModal();renderSimulados();alert('Gabarito salvo para: '+classes.join(', ')+'.')}
function importKeyCSV(id){const classes=selectedKeyClasses();if(!classes.length)return alert('Selecione pelo menos uma turma antes de importar o gabarito.');const input=document.createElement('input');input.type='file';input.accept='.csv,.txt';input.onchange=async()=>{const rows=parseCSV(await input.files[0].text());const key=clone(getKey(id,classes[0]));for(const r of rows){const q=Number(r.questao||r.q||r.numero||Object.values(r)[0]);const a=(r.resposta||r.gabarito||r.alternativa||Object.values(r)[1]||'').toUpperCase().trim();if(q>=1&&q<=key.length&&'ABCD'.includes(a))key[q-1]=a}setKeyForClasses(id,classes,key);save();closeModal();renderSimulados();alert('Gabarito importado para: '+classes.join(', ')+'.')};input.click()}
function renderCorrecao(){document.getElementById('correcao').innerHTML=`<div class="card"><h2>📷 Corrigir cartões</h2><p class="muted">Fluxo rápido: <b>ler QR do simulado → o leitor fecha → a câmera do cartão abre automaticamente</b>. No celular, use a posição horizontal para fotografar o cartão inteiro.</p><div class="grid grid-3"><div class="field"><label>Simulado</label><select id="scanSim" onchange="resetScan()">${state.simulados.map(s=>`<option value="${s.id}">${esc(s.nome)} — ${s.cartao} questões</option>`).join('')}</select></div><div class="field"><label>Turma</label><select id="scanClass" onchange="fillScanStudents()">${state.classes.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Aluno</label><select id="scanStudent"></select></div></div><div class="batch-bar"><b>1º passo:</b><button class="btn red" onclick="startQrFlow()">▦ Ler QR do simulado</button><span id="qrFlowStatus" class="progress-text">Leia o QR para carregar o simulado automaticamente.</span><span id="batchInfo" class="progress-text">0 cartões salvos nesta sessão.</span></div><div class="scanner"><div><div class="camera-box" id="cameraBox"><video id="video" autoplay playsinline muted></video><canvas id="overlay"></canvas><div class="guide"><div class="guide-label" id="guideLabel">Primeiro leia o QR. Depois, a câmera do cartão abrirá automaticamente.</div></div></div><div class="toolbar"><button class="btn primary" onclick="startCardCamera()">▶ Abrir câmera do cartão</button><button class="btn red" onclick="captureAndRead()">📸 Capturar e corrigir</button><button class="btn light" onclick="pickImage()">🖼 Escolher foto</button><button class="btn light" onclick="startQrFlow()">▦ Ler QR novamente</button><input id="imagePicker" type="file" accept="image/*" hidden onchange="readPickedImage(this.files[0])"></div><div id="scanStatus" class="status">Aguardando QR do simulado.</div></div><div class="card"><h3>Resultado da leitura</h3><div id="scanSummary" class="muted">Nenhuma leitura realizada.</div><div class="toolbar"><button class="btn ok" onclick="saveScanResult(false)">💾 Salvar correção</button><button class="btn primary" onclick="saveScanResult(true)">💾 Salvar e próximo aluno</button><button class="btn light" onclick="manualAnswers()">✍ Revisar respostas</button></div><div class="notice">Questões ambíguas ou com baixa confiança ficam para conferência. O sistema não transforma uma leitura duvidosa em resposta automática.</div></div></div><div id="scanResult" style="margin-top:14px"></div></div>`;fillScanStudents();updateBatchInfo()}
function fillScanStudents(){const sel=document.getElementById('scanStudent');if(!sel)return;const cls=document.getElementById('scanClass')?.value||'';sel.innerHTML='<option value="">— selecione —</option>'+state.students.filter(s=>s.turma===cls).sort((a,b)=>a.nome.localeCompare(b.nome,'pt')).map(s=>`<option value="${s.id}">${esc(s.nome)}${s.id?' — '+esc(s.id):''}</option>`).join('')}
function resetScan(){scanAnswers=[];scanConfidence=[];scanAmb=[];document.getElementById('scanResult').innerHTML='';document.getElementById('scanSummary').textContent='Nenhuma leitura realizada.'}
async function startCardCamera(){try{if(stream)stopCamera(true);await requestLandscape();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});const v=document.getElementById('video');v.srcObject=stream;await v.play();document.getElementById('guideLabel').textContent='Enquadre somente 1 cartão • mantenha os 4 marcadores pretos visíveis';setStatus('Câmera do cartão aberta. O QR já foi fechado.','');}catch(e){setStatus('Não foi possível abrir a câmera. Em celular, use HTTPS e permita a câmera.','bad')}}
async function requestLandscape(){try{if(document.documentElement.requestFullscreen&&!document.fullscreenElement)await document.documentElement.requestFullscreen();if(screen.orientation?.lock)await screen.orientation.lock('landscape')}catch(e){}}
function exitFullscreen(){try{if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen()}catch(e){}}
function stopCamera(keepScreen=false){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(!keepScreen)exitFullscreen()}
async function startQrFlow(){try{if(!('BarcodeDetector' in window)){alert('Este navegador não possui BarcodeDetector. Use Chrome/Edge atualizado ou selecione o simulado manualmente e abra a câmera do cartão.');return}if(stream)stopCamera();await requestLandscape();const detector=new BarcodeDetector({formats:['qr_code']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});const v=document.getElementById('video');v.srcObject=stream;await v.play();document.getElementById('guideLabel').textContent='Aponte para o QR Code do simulado';setStatus('Lendo QR do simulado…','');document.getElementById('qrFlowStatus').textContent='Aponte para o QR Code…';let tries=0;const loop=async()=>{if(!stream)return;tries++;try{const codes=await detector.detect(v);if(codes.length){const raw=codes[0].rawValue||'';const m=raw.match(/^JPII\|SIMULADO\|(S?\d+)(?:\|TURMA\|(.+))?$/i);if(m){const id=m[1].toUpperCase().startsWith('S')?m[1].toUpperCase():'S'+m[1];const sel=document.getElementById('scanSim');if([...sel.options].some(o=>o.value===id)){sel.value=id;const turma=m[2];if(turma&&state.classes.includes(turma)){document.getElementById('scanClass').value=turma;fillScanStudents()}resetScan();stopCamera(true);document.getElementById('qrFlowStatus').textContent='QR reconhecido: '+id+(turma?' • '+turma:'')+'.';setStatus('QR reconhecido. Abrindo câmera do cartão…','good');setTimeout(()=>startCardCamera(),250);return}}}}catch(e){}if(stream)requestAnimationFrame(loop)};loop()}catch(e){setStatus('Não foi possível abrir o leitor de QR. Use HTTPS e permita a câmera.','bad')}}
function fillScanStudents(){const sel=document.getElementById('scanStudent');if(!sel)return;const cls=document.getElementById('scanClass')?.value||'';sel.innerHTML='<option value="">— selecione —</option>'+state.students.filter(s=>s.turma===cls).sort((a,b)=>a.nome.localeCompare(b.nome,'pt')).map(s=>`<option value="${s.id}">${esc(s.nome)}${s.id?' — '+esc(s.id):''}</option>`).join('')}
function resetScan(){scanAnswers=[];scanConfidence=[];scanAmb=[];document.getElementById('scanResult').innerHTML='';document.getElementById('scanSummary').textContent='Nenhuma leitura realizada.'}
function captureAndRead(){const v=document.getElementById('video');if(!v||!v.videoWidth)return setStatus('Abra a câmera primeiro.','warn');const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);lastFrame=c;processImage(c)}

function readPickedImage(file){if(!file)return;const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const max=1800,scale=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);lastFrame=c;processImage(c)};img.src=URL.createObjectURL(file)}
async function scanQrContext(){try{if(!('BarcodeDetector' in window)){alert('Este navegador não disponibiliza leitura de QR pela câmera. Você pode selecionar o simulado manualmente.');return}const detector=new BarcodeDetector({formats:['qr_code']});const source=lastFrame||document.getElementById('video');const codes=await detector.detect(source);if(!codes.length){setStatus('Nenhum QR encontrado. Se estiver usando um cartão novo, enquadre o QR e tente novamente.','warn');return}const raw=codes[0].rawValue||'';const m=raw.match(/JPII\|SIMULADO\|(\d+)/i);if(m){const id='S'+m[1];const sel=document.getElementById('scanSim');if([...sel.options].some(o=>o.value===id)){sel.value=id;resetScan();setStatus('QR identificado: Simulado '+m[1]+'. Agora capture o cartão.','good');return}}setStatus('QR lido, mas não reconhecido pelo aplicativo.','warn')}catch(e){setStatus('Não foi possível ler o QR neste navegador.','warn')}}
function markerCandidates(canvas){
 const ctx=canvas.getContext('2d',{willReadFrequently:true}),w=canvas.width,h=canvas.height;
 const scale=Math.min(1,1000/w),W=Math.max(1,Math.round(w*scale)),H=Math.max(1,Math.round(h*scale));
 const small=document.createElement('canvas');small.width=W;small.height=H;small.getContext('2d').drawImage(canvas,0,0,W,H);
 const d=small.getContext('2d',{willReadFrequently:true}).getImageData(0,0,W,H).data, bw=new Uint8Array(W*H);
 for(let i=0;i<bw.length;i++){const g=(d[i*4]+d[i*4+1]+d[i*4+2])/3;bw[i]=g<75?1:0}
 const seen=new Uint8Array(W*H),cs=[];const qx=new Int32Array(W*H),qy=new Int32Array(W*H);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const idx=y*W+x;if(!bw[idx]||seen[idx])continue;let head=0,tail=0,minx=x,maxx=x,miny=y,maxy=y,n=0;qx[tail]=x;qy[tail++]=y;seen[idx]=1;
  while(head<tail){const xx=qx[head],yy=qy[head++];n++;if(xx<minx)minx=xx;if(xx>maxx)maxx=xx;if(yy<miny)miny=yy;if(yy>maxy)maxy=yy;
   for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=xx+dx,ny=yy+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const ni=ny*W+nx;if(bw[ni]&&!seen[ni]){seen[ni]=1;qx[tail]=nx;qy[tail++]=ny}}
  }
  const ww=maxx-minx+1,hh=maxy-miny+1;if(n>=55&&n<=900&&ww>=7&&ww<=30&&hh>=7&&hh<=30&&ww/hh>.65&&ww/hh<1.5){cs.push({x:(minx+maxx)/2/scale,y:(miny+maxy)/2/scale,w:ww/scale,h:hh/scale,a:n})}
 }
 return cs;
}
function chooseMarkers(cs,w,h){
 const p=cs.filter(x=>x.x>w*.01&&x.x<w*.99&&x.y>h*.05&&x.y<h*.95).sort((a,b)=>a.y-b.y);
 const left=p.filter(x=>x.x<w*.10),right=p.filter(x=>x.x>w*.90);if(left.length<2||right.length<2)return null;
 let best=null;
 for(const tl of left)for(const bl of left)for(const tr of right)for(const br of right){
  if(!(tl.y<bl.y&&tr.y<br.y))continue;const span=((bl.y-tl.y)+(br.y-tr.y))/2;if(span<h*.06||span>h*.30)continue;
  if(Math.abs(tl.y-tr.y)>h*.045||Math.abs(bl.y-br.y)>h*.045)continue;
  const width=((tr.x-tl.x)+(br.x-bl.x))/2;if(width<w*.65)continue;
  const score=width*span/(1+Math.abs(tl.y-tr.y)+Math.abs(bl.y-br.y));
  if(!best||score>best.score)best={tl,tr,bl,br,score};
 }
 return best?{tl:best.tl,tr:best.tr,bl:best.bl,br:best.br}:null;
}
function bilinear(m,u,v){const a=m.tl,b=m.tr,c=m.bl,d=m.br;return{x:(1-v)*((1-u)*a.x+u*b.x)+v*((1-u)*c.x+u*d.x),y:(1-v)*((1-u)*a.y+u*b.y)+v*((1-u)*c.y+u*d.y)}}
function templateFor(n){
 const xs=[.0435,.0725,.1015,.1305,.2505,.2795,.3085,.3375,.4575,.4865,.5155,.5445,.6645,.6935,.7225,.7515,.8715,.9005,.9295,.9585];
 const ys30=[.265,.392,.518,.646,.774,.901],ys35=[.242,.352,.461,.570,.680,.789,.898];
 const rows=n===35?ys35:ys30;const pos=[];for(let q=1;q<=n;q++){const g=Math.floor((q-1)/rows.length),r=(q-1)%rows.length;for(let o=0;o<4;o++)pos.push({q,o,x:xs[g*4+o],y:rows[r]})}return {pos};
}
function sampleBubble(ctx,p,expectedR){
 const R=Math.max(3,Math.min(expectedR*.48,6)),x0=Math.max(0,Math.floor(p.x-R)),x1=Math.min(ctx.canvas.width-1,Math.ceil(p.x+R)),y0=Math.max(0,Math.floor(p.y-R)),y1=Math.min(ctx.canvas.height-1,Math.ceil(p.y+R));
 const d=ctx.getImageData(x0,y0,x1-x0+1,y1-y0+1).data;let dark=0,total=0,sum=0;
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const dx=x-p.x,dy=y-p.y;if(dx*dx+dy*dy>R*R)continue;const i=((y-y0)*(x1-x0+1)+(x-x0))*4,g=(d[i]+d[i+1]+d[i+2])/3;sum+=g;total++;if(g<145)dark++}
 return {ratio:total?dark/total:0,mean:total?sum/total:255};
}
function drawScanOverlay(m,sim){const c=document.getElementById('overlay'),v=document.getElementById('video');if(!c||!v||!v.videoWidth||!m)return;c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.strokeStyle='#20d77a';x.lineWidth=Math.max(3,c.width/500);x.beginPath();x.moveTo(m.tl.x,m.tl.y);x.lineTo(m.tr.x,m.tr.y);x.lineTo(m.br.x,m.br.y);x.lineTo(m.bl.x,m.bl.y);x.closePath();x.stroke();x.fillStyle='#20d77a';[m.tl,m.tr,m.bl,m.br].forEach(p=>x.fillRect(p.x-6,p.y-6,12,12))}
function processImage(canvas){
 setStatus('Analisando o cartão…');const sim=state.simulados.find(s=>s.id===document.getElementById('scanSim').value)||state.simulados[0];
 const cs=markerCandidates(canvas),m=chooseMarkers(cs,canvas.width,canvas.height);if(!m){setStatus('Não consegui localizar um conjunto válido dos 4 marcadores. Fotografe somente um cartão, sem cortar os cantos e sem incluir o segundo cartão da folha.','bad');return}
 const tpl=templateFor(sim.cartao),ctx=canvas.getContext('2d',{willReadFrequently:true}),answers=[],conf=[],amb=[];
 const markerSize=(m.tl.w+m.tr.w+m.bl.w+m.br.w)/4,expectedR=Math.max(6,markerSize*1.0);
 for(let q=1;q<=sim.cartao;q++){
  const scores=[];for(let o=0;o<4;o++){const pp=tpl.pos.find(z=>z.q===q&&z.o===o),p=bilinear(m,pp.x,pp.y);scores.push(sampleBubble(ctx,p,expectedR).ratio)}
  const sorted=scores.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v),top=sorted[0],second=sorted[1];let a='',stateq='blank';
  if(top.v>=Number(state.settings.markThreshold)){if(second.v>=top.v/Number(state.settings.ambiguityRatio)){a='';stateq='amb'}else{a='ABCD'[top.i];stateq='marked'}}
  answers.push(a);conf.push(top.v);amb.push(stateq==='amb');
 }
 scanAnswers=answers;scanConfidence=conf;scanAmb=amb;lastFrame=canvas;drawScanOverlay(m,sim);setStatus('Leitura concluída. Revise as marcações em amarelo antes de salvar.',amb.some(Boolean)?'warn':'good');showScanResult(sim);updateBatchInfo();
}
function showScanResult(sim){const turma=document.getElementById('scanClass')?.value||'';const keys=getKey(sim.id,turma);let correct=0,wrong=0,blank=0,amb=0;scanAnswers.forEach((a,i)=>{if(!a)blank++;else if(scanAmb[i])amb++;else if(keys[i]&&a===keys[i])correct++;else if(keys[i])wrong++});const answered=sim.cartao-blank,pct=sim.cartao?correct/sim.cartao*100:0;document.getElementById('scanSummary').innerHTML=`<div class="result-box"><div class="result-kpi"><strong>${correct}</strong>Certas</div><div class="result-kpi"><strong>${wrong}</strong>Erradas</div><div class="result-kpi"><strong>${blank}</strong>Em branco</div><div class="result-kpi"><strong>${pct.toFixed(1)}%</strong>Percentual</div></div><p class="small">Respondidas: ${answered}/${sim.cartao} • Ambíguas: ${amb}</p>`;let html='<div class="card"><h3>Conferência questão a questão</h3><div class="check-list">';for(let i=0;i<sim.cartao;i++){const a=scanAnswers[i]||'—',k=keys[i]||'?';let cl=!scanAnswers[i]?'blank':scanAmb[i]?'amb':(k!=='?'&&a===k?'correct':'wrong');html+=`<div class="check ${cl}"><b>${String(i+1).padStart(2,'0')}</b> → ${a} <span class="small">${k==='?'?'gabarito vazio':'gabarito '+k}${scanConfidence[i]!=null?' • '+Math.round(scanConfidence[i]*100)+'%':''}</span></div>`}html+='</div><div class="toolbar"><button class="btn light" onclick="manualAnswers()">✍ Revisar respostas</button></div></div>';document.getElementById('scanResult').innerHTML=html}
function manualAnswers(){const sim=state.simulados.find(s=>s.id===document.getElementById('scanSim').value)||state.simulados[0],a=scanAnswers.length?scanAnswers:Array(sim.cartao).fill('');let html='<h2>Conferir respostas</h2><p class="muted">Altere qualquer resposta antes de salvar. “—” significa em branco.</p><div class="answer-grid">';const per=Math.ceil(sim.cartao/5);for(let start=1;start<=sim.cartao;start+=per){const end=Math.min(sim.cartao,start+per-1);html+='<div class="answer-col">';for(let q=start;q<=end;q++){html+='<div class="answer-row"><span class="q">'+String(q).padStart(2,'0')+'</span>';for(const o of ['A','B','C','D',''])html+='<button class="bubble-btn '+(a[q-1]===o?'selected':'')+'" onclick="setManual('+q+',\''+o+'\',this)">'+(o||'—')+'</button>';html+='</div>'}html+='</div>'}html+='</div><div class="toolbar"><button class="btn primary" onclick="closeModal();showScanResult(state.simulados.find(s=>s.id===document.getElementById(\'scanSim\').value))">Aplicar</button></div>';openModal(html)}

function viewResult(id){const r=state.results.find(x=>x.id===id);if(!r)return;const s=state.students.find(x=>x.id===r.studentId),sim=state.simulados.find(x=>x.id===r.simuladoId);openModal(`<h2>${esc(s?.nome||'Aluno')}</h2><p>${esc(sim?.nome||'Simulado')} • ${new Date(r.date).toLocaleString('pt-BR')}</p><div class="result-box"><div class="result-kpi"><strong>${r.correct}</strong>Certas</div><div class="result-kpi"><strong>${r.wrong}</strong>Erradas</div><div class="result-kpi"><strong>${r.blank}</strong>Brancos</div><div class="result-kpi"><strong>${r.grade.toFixed(2)}</strong>Nota</div></div><h3>Por disciplina</h3><div class="table-wrap"><table class="table"><tr><th>Disciplina</th><th>Certas</th><th>Erradas</th><th>Brancos</th><th>%</th></tr>${r.by.map(d=>`<tr><td>${esc(d.disciplina)}</td><td>${d.certas}</td><td>${d.erradas}</td><td>${d.brancos}</td><td>${d.pct.toFixed(1)}%</td></tr>`).join('')}</table></div>`)}
function renderRelatorios(){const byClass={};state.results.forEach(r=>{const s=state.students.find(x=>x.id===r.studentId);if(!s)return;byClass[s.turma]=byClass[s.turma]||{n:0,p:0,c:0,w:0,b:0};byClass[s.turma].n++;byClass[s.turma].p+=r.pct;byClass[s.turma].c+=r.correct;byClass[s.turma].w+=r.wrong;byClass[s.turma].b+=r.blank});document.getElementById('relatorios').innerHTML=`<div class="card"><h2>Relatórios e desempenho</h2><div class="table-wrap"><table class="table"><tr><th>Turma</th><th>Correções</th><th>Média %</th><th>Certas</th><th>Erradas</th><th>Brancos</th></tr>${state.classes.map(c=>{const x=byClass[c]||{n:0,p:0,c:0,w:0,b:0};return `<tr><td>${esc(c)}</td><td>${x.n}</td><td>${x.n?(x.p/x.n).toFixed(1):'0.0'}%</td><td>${x.c}</td><td>${x.w}</td><td>${x.b}</td></tr>`}).join('')}</table></div></div><div class="grid grid-2" style="margin-top:14px"><div class="card"><h2>Desempenho por disciplina</h2><select id="reportSim" onchange="drawQuestionReport()">${state.simulados.map(s=>`<option value="${s.id}">${esc(s.nome)}</option>`).join('')}</select><div id="disciplineReport" style="margin-top:10px"></div></div><div class="card"><h2>Análise por questão</h2><p class="muted">Veja distribuição das alternativas, brancos e acertos.</p><div id="questionReport"></div></div></div>`;drawQuestionReport()}
function drawQuestionReport(){const id=document.getElementById('reportSim')?.value;if(!id)return;const sim=state.simulados.find(s=>s.id===id),rs=state.results.filter(r=>r.simuladoId===id),keyFor=r=>getKey(id,state.students.find(x=>x.id===r.studentId)?.turma||'');let dhtml='<div class="table-wrap"><table class="table"><tr><th>Disciplina</th><th>Questões</th><th>Certas</th><th>Erradas</th><th>Brancos</th><th>%</th></tr>';sim.disciplinas.forEach(d=>{let c=0,w=0,b=0,n=0;rs.forEach(r=>{for(let q=d[1];q<=d[2];q++){n++;const key=keyFor(r),a=r.answers[q-1],k=key[q-1];if(!a)b++;else if(k&&a===k)c++;else if(k)w++}});dhtml+=`<tr><td>${esc(d[0])}</td><td>${n}</td><td>${c}</td><td>${w}</td><td>${b}</td><td>${n?(c/n*100).toFixed(1):'0.0'}%</td></tr>`});dhtml+='</table></div>';document.getElementById('disciplineReport').innerHTML=dhtml;let html='<div class="table-wrap"><table class="table"><tr><th>Q</th><th>Gab.</th><th>A</th><th>B</th><th>C</th><th>D</th><th>Branco</th><th>Acerto</th></tr>';for(let q=0;q<sim.cartao;q++){const cnt={A:0,B:0,C:0,D:0,'':0};rs.forEach(r=>cnt[r.answers[q]||'']++);let acc=0;for(const r of rs){const k=getKey(id,state.students.find(x=>x.id===r.studentId)?.turma||'')[q];if(k&&r.answers[q]===k)acc++}let displayKeys=[...new Set(rs.map(r=>getKey(id,state.students.find(x=>x.id===r.studentId)?.turma||'')[q]).filter(Boolean))].join('/');html+=`<tr><td>${q+1}</td><td>${displayKeys||'—'}</td><td>${cnt.A}</td><td>${cnt.B}</td><td>${cnt.C}</td><td>${cnt.D}</td><td>${cnt['']}</td><td>${acc}</td></tr>`}html+='</table></div>';document.getElementById('questionReport').innerHTML=html}
function renderConfig(){const c=state.sync||{};document.getElementById('config').innerHTML=`<div class="grid grid-2"><div class="card"><h2>Configurações</h2><div class="field"><label>Nota máxima</label><input id="gradeMax" type="number" min="1" max="100" step="0.5" value="${state.settings.gradeMax}"></div><div class="field"><label>Limite de marcação</label><input id="threshold" type="number" min="0.03" max="0.8" step="0.01" value="${state.settings.markThreshold}"></div><div class="field"><label>Razão de ambiguidade</label><input id="ambiguity" type="number" min="1.01" max="3" step="0.01" value="${state.settings.ambiguityRatio}"></div><button class="btn primary" onclick="saveConfig()">Salvar configurações</button></div><div class="card"><h2>Identidade da escola</h2><img class="logo-preview" src="assets/logo-escola.png"><p><b>${esc(state.school)}</b><br>${esc(state.dre)}</p><p class="muted">O aplicativo usa o símbolo enviado pela escola sobre fundo branco e as cores vermelho/azul do cartão-resposta.</p><h3>Turmas</h3><div id="classList">${state.classes.map(c=>`<span class="pill">${esc(c)}</span>`).join(' ')}</div><div class="toolbar"><input id="newClass" placeholder="Ex.: 6º A" style="padding:9px;border:1px solid #ccd6e3;border-radius:8px"><button class="btn light" onclick="addClass()">Adicionar turma</button></div></div></div><div class="card" style="margin-top:14px"><h2>☁️ Sincronização entre PC e celulares</h2><p class="muted">Todos os aparelhos que entrarem com a <b>mesma conta do sistema</b> verão alunos, gabaritos, simulados e correções compartilhados. O banco usado é o Supabase.</p><div class="grid grid-2"><div class="field"><label>URL do projeto Supabase</label><input id="sbUrl" placeholder="https://xxxx.supabase.co" value="${esc(c.url||'')}"></div><div class="field"><label>Chave pública (anon)</label><input id="sbKey" type="password" placeholder="eyJ..." value="${esc(c.anonKey||'')}"></div><div class="field"><label>E-mail da conta</label><input id="sbEmail" type="email" value="${esc(c.email||'')}"></div><div class="field"><label>Senha</label><input id="sbPass" type="password" placeholder="••••••••"></div></div><div class="toolbar"><button class="btn primary" onclick="connectSync()">☁️ Conectar e sincronizar</button><button class="btn light" onclick="createSyncAccount()">Criar conta</button><button class="btn danger" onclick="signOutSync()">Desconectar</button></div><div class="status ${syncReady?'good':'warn'}">${syncReady?'🟢 Conectado e sincronizando'+(state.sync.lastSync?' • última sincronização '+new Date(state.sync.lastSync).toLocaleTimeString('pt-BR'):''):'🟡 Não conectado. O sistema continua funcionando localmente até você configurar o Supabase.'}</div><p class="small muted">Importante: a URL e a chave são do seu projeto Supabase. A mesma conta de e-mail/senha pode ser usada no PC e em todos os celulares da equipe.</p></div><div class="card" style="margin-top:14px"><h2>Backup e restauração</h2><p>Faça um backup antes de trocar de aparelho ou navegador.</p><div class="toolbar"><button class="btn primary" onclick="exportBackupOnly()">Baixar backup JSON</button><label class="btn light">Restaurar JSON <input type="file" accept="application/json" hidden onchange="restoreData(this.files[0])"></label><button class="btn danger" onclick="factoryReset()">Apagar dados locais</button></div></div>`}
async function connectSync(){const url=document.getElementById('sbUrl').value.trim(),anonKey=document.getElementById('sbKey').value.trim(),email=document.getElementById('sbEmail').value.trim(),pass=document.getElementById('sbPass').value;if(!url||!anonKey||!email||!pass)return alert('Preencha URL, chave pública, e-mail e senha.');state.sync={...state.sync,url,anonKey,email,enabled:true};saveSyncConfig(state.sync);try{supa=window.supabase.createClient(url,anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});supa._url=url;const r=await supa.auth.signInWithPassword({email,password:pass});if(r.error)throw r.error;syncUser=r.data.user;syncReady=true;await pullRemote(true);subscribeRealtime();renderConfig();alert('Sincronização ativada neste aparelho.')}catch(e){syncReady=false;alert('Falha ao conectar: '+e.message)}}
async function createSyncAccount(){const url=document.getElementById('sbUrl').value.trim(),anonKey=document.getElementById('sbKey').value.trim(),email=document.getElementById('sbEmail').value.trim(),pass=document.getElementById('sbPass').value;if(!url||!anonKey||!email||!pass)return alert('Preencha URL, chave pública, e-mail e senha para criar a conta.');saveSyncConfig({url,anonKey,email});supa=window.supabase.createClient(url,anonKey,{auth:{persistSession:true,autoRefreshToken:true}});supa._url=url;await signUpSync(email,pass)}
function saveConfig(){state.settings.gradeMax=Number(document.getElementById('gradeMax').value)||10;state.settings.markThreshold=Number(document.getElementById('threshold').value)||.13;state.settings.ambiguityRatio=Number(document.getElementById('ambiguity').value)||1.22;save();alert('Configurações salvas.')}
function addClass(){const c=document.getElementById('newClass').value.trim();if(c&&!state.classes.includes(c)){state.classes.push(c);save();renderConfig()}}
function backupData(){exportBackupOnly()}
function exportBackupOnly(){download('corretor-jpii-backup.json',JSON.stringify(state,null,2),'application/json')}
async function restoreData(file){if(!file)return;try{const obj=JSON.parse(await file.text());if(!obj.simulados||!obj.students||!obj.results)throw Error('backup');state=obj;save();go('dashboard');alert('Backup restaurado.')}catch(e){alert('Backup inválido.')}}
function factoryReset(){if(confirm('Apagar todos os alunos, gabaritos e resultados deste navegador?')){localStorage.removeItem(APP);state=clone(defaultState);go('dashboard')}}
function download(name,data,type='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportStudentsCSV(){const rows=[['Nome','Turma','Matrícula/ID'],...state.students.map(s=>[s.nome,s.turma,s.id])];download('alunos-jpii.csv',rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n'),'text/csv;charset=utf-8')}
function exportResultsCSV(){const rows=[['Aluno','Turma','Simulado','Data','Certas','Erradas','Brancos','Percentual','Nota'],...state.results.map(r=>{const s=state.students.find(x=>x.id===r.studentId),sim=state.simulados.find(x=>x.id===r.simuladoId);return [s?.nome||'',s?.turma||'',sim?.nome||r.simuladoId,new Date(r.date).toLocaleString('pt-BR'),r.correct,r.wrong,r.blank,r.pct.toFixed(2),r.grade.toFixed(2)]})];download('resultados-jpii.csv',rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n'),'text/csv;charset=utf-8')}
function qrPayload(id,turma=''){return `JPII|SIMULADO|${id}${turma?`|TURMA|${turma}`:''}`}
function qrDataUrl(id,size=420,turma=''){return new Promise(resolve=>{const holder=document.createElement('div');holder.style.position='fixed';holder.style.left='-10000px';document.body.appendChild(holder);if(window.QRCode){new QRCode(holder,{text:qrPayload(id,turma),width:size,height:size,correctLevel:QRCode.CorrectLevel.M});setTimeout(()=>{const img=holder.querySelector('img');const cv=holder.querySelector('canvas');const url=img?.src||cv?.toDataURL('image/png')||'';holder.remove();resolve(url)},80)}else{holder.remove();resolve('')}})}
function cardTitle(s,turma){return `${s.nome} — ${turma} ano`}
function openCardSeries(id){const s=state.simulados.find(x=>x.id===id);if(!s)return;openModal(`<h2>Cartões-resposta por série</h2><p class="muted">Cada série recebe um cartão próprio, porque o gabarito pode ser diferente. Escolha uma série para editar o gabarito, gerar o cartão e imprimir o QR correspondente.</p><div class="grid grid-2">${state.classes.map(c=>`<div class="card"><h3>${esc(cardTitle(s,c))}</h3><p class="small muted">QR: ${esc(s.id)} • ${esc(c)} • gabarito: ${getKey(id,c).filter(Boolean).length}/${s.cartao}</p><div class="toolbar"><button class="btn primary" onclick="closeModal();editKey('${id}','${esc(c)}')">✏️ Editar gabarito</button><button class="btn light" onclick="closeModal();printCard('${id}','${esc(c)}')">🖨 Imprimir cartão</button><button class="btn red" onclick="closeModal();printQrOnly('${id}','${esc(c)}')">🔲 Imprimir QR</button></div></div>`).join('')}</div><div class="toolbar"><button class="btn light" onclick="closeModal()">Fechar</button></div>`)}
async function showQrOnly(id,turma=''){const s=state.simulados.find(x=>x.id===id);if(!s)return;if(!turma)return openCardSeries(id);const url=await qrDataUrl(id,360,turma);openModal(`<h2>QR Code — ${esc(cardTitle(s,turma))}</h2><p class="muted">Este QR identifica o simulado e a série. Ao ler, o aplicativo carrega automaticamente o gabarito correto da turma.</p><div style="text-align:center"><div class="qrbox"><img src="${url}" style="width:360px;max-width:100%;height:auto"></div><p><b>${esc(s.id)} • ${esc(turma)}</b></p></div><div class="toolbar"><button class="btn red" onclick="printQrOnly('${id}','${esc(turma)}')">🖨 Imprimir somente QR</button><button class="btn light" onclick="closeModal()">Fechar</button></div>`)}
async function printQrOnly(id,turma=''){const s=state.simulados.find(x=>x.id===id);if(!s)return;if(!turma)return openCardSeries(id);const url=await qrDataUrl(id,520,turma);const v=document.getElementById('cartaoPrint');v.innerHTML=`<div class="print-only" style="font-family:Arial;padding:20mm;text-align:center;color:#111"><img src="assets/logo-escola.png" style="width:70px;height:70px;object-fit:contain"><h1 style="color:#06356d;margin:8px 0">ESCOLA ESTADUAL JOÃO PAULO II</h1><p style="color:#b40000;font-weight:700;margin:0 0 16px">QR CODE PARA CORREÇÃO DE SIMULADO</p><h2 style="color:#06356d">${esc(cardTitle(s,turma))}</h2><img src="${url}" style="width:110mm;max-width:80vw"><p style="font-size:12px">Identificador: <b>${esc(s.id)} • ${esc(turma)}</b></p><p style="font-size:11px;color:#666">Aponte a câmera do aplicativo para este QR Code antes de ler os cartões-resposta.</p></div>`;v.classList.add('printing');window.print();setTimeout(()=>v.classList.remove('printing'),700)}
async function printCard(id,turma=''){const s=state.simulados.find(x=>x.id===id);if(!s)return;if(!turma)return openCardSeries(id);const qrSrc=await qrDataUrl(id,360,turma);const v=document.getElementById('cartaoPrint');const n=s.cartao,cols=5;let html=`<div class="print-only" style="font-family:Arial;padding:12mm;color:#111"><div style="display:flex;align-items:center;justify-content:space-between"><img src="assets/logo-escola.png" style="width:70px;height:70px;object-fit:contain"><div style="text-align:center;flex:1"><h1 style="color:#06356d;font-style:italic;margin:0">CARTÃO RESPOSTA</h1><h2 style="color:#06356d;margin:4px 0">${esc(cardTitle(s,turma))}</h2><p style="margin:0;color:#333">Disciplina hoje, conquista amanhã!</p></div><div style="width:70px;text-align:center"><img src="${qrSrc}" style="width:58px;height:58px;object-fit:contain"><div style="font-size:8px">QR • ${esc(turma)}</div></div></div><div class="stripe" style="margin:7px 0 14px"></div><div style="border:1px solid #9bb1cc;border-radius:10px;padding:14px;margin-bottom:12px"><b>Nome:</b> ________________________________ &nbsp;&nbsp; <b>Turma:</b> ${esc(turma)} &nbsp;&nbsp; <b>Data:</b> ____/____/________</div><div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:8px">`;const per=Math.ceil(n/cols);for(let c=0;c<cols;c++){const a=c*per+1,b=Math.min(n,(c+1)*per);html+=`<div style="border:1px solid #7f9abc;border-radius:8px;padding:8px;position:relative"><b style="font-size:13px">A &nbsp; B &nbsp; C &nbsp; D</b>${Array.from({length:b-a+1},(_,j)=>{const q=a+j;return `<div style="display:grid;grid-template-columns:28px repeat(4,1fr);gap:4px;align-items:center;margin:6px 0;font-size:12px"><b>${String(q).padStart(2,'0')}</b>${['A','B','C','D'].map(o=>`<span style="width:18px;height:18px;border:1.5px solid #555;border-radius:50%;display:inline-block"></span>`).join('')}</div>`}).join('')}<i style="position:absolute;left:4px;top:4px;width:8px;height:8px;background:#000"></i><i style="position:absolute;right:4px;top:4px;width:8px;height:8px;background:#000"></i><i style="position:absolute;left:4px;bottom:4px;width:8px;height:8px;background:#000"></i><i style="position:absolute;right:4px;bottom:4px;width:8px;height:8px;background:#000"></i></div>`}html+=`</div><div style="margin-top:12px;border-top:5px solid #b40000;border-bottom:5px solid #06356d;padding:5px;text-align:center;color:#06356d;font-weight:700">ESCOLA ESTADUAL JOÃO PAULO II &nbsp; | &nbsp; DRE MARACANÃ</div><p style="font-size:10px;color:#666">Modelo gerado pelo Corretor de Simulados. Os quatro marcadores pretos são usados pela leitura automática.</p></div>`;v.innerHTML=html;v.classList.add('printing');window.print();setTimeout(()=>v.classList.remove('printing'),500)}
function openModal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
window.addEventListener('beforeunload',stopCamera);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
nav();renderDashboard(); initSupabase().then(()=>{if(syncReady){subscribeRealtime();renderConfig();}});
</script>
</body></html>
